{% extends "base.html" %}

{% block content %}
{% for message in get_flashed_messages() %}
<br>
<div class="container">
    <div class="alert alert-warning">
        <button type="button" class="close" data-dismiss="alert">&times;</button>
        {{ message }}
    </div>
</div>
{% endfor %}
<div class="row mt-5">
    <div class="col-md-12">
        <div class="chat-container">
            <div class="row justify-content-center">
                <div class="col-12 d-flex justify-content-center">
                    <h2>Thank you for taking the survey!</h2>
                </div>
            </div>
            <br>
            <div class="col-12 d-flex justify-content-center">
                <p>
                    <a href="{{ url_for('qualtrics') }}">Click here to be redirected to the Qualtrics page</a>
                </p>
            </div>
            <!--
            <div class="row justify-content-center">
                <p>
                    <b>You can now log out using the button in the top right corner and close this page.</b>
                </p>
                <p>
                    You will be automatically logged out in <span id="countdown">10</span> seconds.
                </p>
            </div>
            -->
        </div>
    </div>
</div>

<!-- JavaScript for countdown and redirection -->
<script>
    // Set the countdown time (in seconds)
    let timeLeft = 10;

    // Update the countdown every second
    const countdownElement = document.getElementById('countdown');
    const countdownInterval = setInterval(() => {
        timeLeft--;
        countdownElement.textContent = timeLeft;

        // Redirect to logout when time is up
        if (timeLeft <= 0) {
            clearInterval(countdownInterval);
            window.location.href = "{{ url_for('logout') }}";
        }
    }, 1000);
</script>
{% endblock %}
