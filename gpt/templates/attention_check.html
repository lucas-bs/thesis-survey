{% extends "base.html" %}

{% block content %}
<div class="row mt-5">
    <div class="col-md-12">
        <div class="chat-container">
            <h1 class="text-center mb-4">Attention Check</h1>
            <p >What was the total number of cards in the grid?</p>
            <form action="/attention_check" method="post">
                <div class="input-group mb-3">
                    <input
                        type="number"
                        name="attention_answer"
                        class="form-control border-dark"
                        placeholder="Enter your answer here..."
                        required
                    >
                </div>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-dark">
                        <i class="bi bi-arrow-right-circle"></i> Next
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>


{% endblock %}
