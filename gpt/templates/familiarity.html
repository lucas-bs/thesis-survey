{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-10 col-md-8 col-lg-8">
            <div class="card my-4 p-4">
                <div class="question-box">
                    <strong>{{ form.ai_usage_frequency.label }}</strong>
                </div>
                <form method="POST">
                    {{ form.hidden_tag() }}

                    <div class="confidence-scale d-flex justify-content-between flex-wrap">
                        {% for option in form.ai_usage_frequency %}
                            <div class="confidence-option">
                                <input type="radio" class="btn-check" name="{{ option.name }}" id="{{ option.id }}" value="{{ option.data }}" autocomplete="off">
                                <label class="btn btn-outline-dark confidence-label" for="{{ option.id }}">{{ option.label.text }}</label>
                            </div>
                        {% endfor %}
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        {{ form.submit(class="btn btn-dark") }}
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    body {
        background-color: #f8f9fa;
    }
    .card {
        border: none;
        border-radius: 15px;
    }
    .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
    }
    .btn-primary:hover {
        background-color: #0056b3;
        border-color: #0056b3;
    }
    .question-box {
        background-color: #e9ecef;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
        padding: 1rem;
        margin-bottom: 1rem;
    }
    .question-box p {
        margin-bottom: 0;
    }
    /* Confidence scale styling */
    .confidence-scale {
        display: flex;
        justify-content: space-between;
        gap: 10px; /* Add gap between options */
    }
    .confidence-option {
        flex: 1;
    }
    /* Hide the radio buttons */
    .confidence-option .btn-check {
        display: none;
    }
    /* Style the labels to look like buttons */
    .confidence-option .confidence-label {
        width: 100%; /* Full width of the container */
        height: 60px; /* Fixed height for consistency */
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #343a40; /* Dark border */
        font-size: 14px; /* Adjusted font size for longer text */
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s, color 0.3s;
        text-align: center; /* Ensure text is centered */
        padding: 5px; /* Add padding for better text wrapping */
        border-radius: 5px; /* Rounded corners */
    }
    /* Style for selected labels */
    .confidence-option .btn-check:checked + .confidence-label {
        background-color: #343a40; /* Black background */
        color: white; /* White text */
        border-color: #343a40; /* Match background color */
    }
    /* Hover effect for labels */
    .confidence-option .confidence-label:hover {
        background-color: #343a40; /* Black background on hover */
        color: white; /* White text on hover */
    }
</style>
{% endblock %}
