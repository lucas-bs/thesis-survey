{% extends "base.html" %}

{% block content %}
<div class="row mt-5">
    <div class="col-md-6 offset-md-3">
        <div class="chat-container p-4">
            <h1 class="text-center mb-4">Attention Check</h1>
            <p class="text-center mb-4">Have you previously completed this survey in any of our earlier sessions?</p>
            <form action="/survey_check" method="post">
                <div class="mb-3">
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="survey_check_answer" id="answerYes" value="yes" required>
                        <label class="form-check-label" for="answerYes">
                            Yes, I have completed it.
                        </label>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="radio" name="survey_check_answer" id="answerNo" value="no">
                        <label class="form-check-label" for="answerNo">
                            No, this is my first time.
                        </label>
                    </div>
                </div>
                <div class="d-flex justify-content-center">
                    <button type="submit" class="btn btn-dark px-4 py-2">
                        <i class="bi bi-arrow-right-circle"></i> Next
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
